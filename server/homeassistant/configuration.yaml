# Minimal Home Assistant for the Kiki dashboard: only what the official
# Xiaomi Home integration and the local REST API need. No default_config
# (it would start bluetooth/dhcp/ssdp/cloud etc. on a headless server).
homeassistant:
  name: Kiki Home
  country: CN
  time_zone: Asia/Shanghai
  unit_system: metric
  currency: CNY
  external_url: https://ha.kiki-home.top

# HA >= 2026.8 keeps HTTP settings in its network configuration, not YAML.
# Bootstrap is isolated by Docker's loopback-only port publication. deploy.sh ha
# confirms localhost:8123 via the admin API before enabling host networking.

frontend:
config:
api:
webhook:      # Xiaomi OAuth lands on /api/webhook/<id>
mobile_app:   # selected Apple Health sensors from the official iPhone companion
kiki_health_reports:
  entities: !include health_recorder.yaml
logger:
  default: warning

# Keep the database small: states only, three days.
recorder:
  purge_keep_days: 3
  commit_interval: 30
  exclude:
    entities: !include health_recorder.yaml
    entity_globs:
      - sensor.kiki_health_reports
